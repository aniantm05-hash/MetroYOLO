[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metro-yolo"
version = "0.1.0"
description = "YOLOv5 passenger counting with task-oriented evaluation"
requires-python = ">=3.10,<3.13"
dependencies = ["Pillow>=10.4,<12"]

[project.optional-dependencies]
app = ["streamlit==1.41.1", "pyarrow==19.0.1"]
inference = ["torch==2.5.1", "torchvision==0.20.1", "numpy==1.26.4", "opencv-python==4.10.0.84", "PyYAML==6.0.2", "pandas==2.2.3", "matplotlib>=3.8,<3.10", "scipy==1.14.1", "seaborn==0.13.2", "requests>=2.32,<3", "tqdm>=4.66,<5", "psutil>=6,<7", "GitPython>=3.1.43,<4", "ipython>=8,<9"]
analysis = ["matplotlib>=3.8,<3.10"]
training = ["tensorboard==2.18.0", "thop==0.1.1.post2209072238"]
dev = ["pytest>=8,<9", "ruff>=0.9,<0.10", "nbformat>=5.10,<6"]

[project.scripts]
metroyolo = "metroyolo.cli:main"
metroyolo-train = "metroyolo.training:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
extend-exclude = ["notebooks/metro_experiments.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.setuptools.package-data]
metroyolo = ["assets/*.png", "assets/*.json"]
